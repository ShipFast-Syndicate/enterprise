name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Public callers cannot resolve private remote reusable workflows.
    # Keep this caller ID and the local summary ID: branch rules require ci / summary.
    uses: ./.github/workflows/public-ci.yml
