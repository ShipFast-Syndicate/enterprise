name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # Nightly drift run on the default branch (develop): catches new advisories,
  # registry changes to resolved peers and runner image drift between merges.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep CI self-contained, with explicit hosted placement and no private hub dependency.
    # Keep this caller ID and the local summary ID: branch rules require ci / summary.
    uses: ./.github/workflows/public-ci.yml
