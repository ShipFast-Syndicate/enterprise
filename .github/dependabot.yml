# Auth peers must move together. Group compatible updates and retain security alerts.
# Security scan policy: allow new versions to age; security updates are exempt.
# The better-auth and release-tooling groups (and the actions the release job
# runs) are still opened as PRs, but the merge gate never merges them without a
# maintainer: see MAINTAINER_* in .github/workflows/dependabot-merge-gate.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - better-auth
          - "@better-auth/*"
          - better-call
          - "@better-fetch/*"
          - semantic-release
          - "@semantic-release/*"
          - "conventional-changelog-*"
          - tsup
          - esbuild
          - typescript
      # Everything the release job executes; held for maintainer review.
      release-tooling:
        patterns:
          - semantic-release
          - "@semantic-release/*"
          - "conventional-changelog-*"
          - tsup
          - esbuild
          - typescript
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
          - better-call
          - "@better-fetch/*"
    labels:
      - dependencies
    ignore:
      # better-call 2 and later are not released as a better-auth peer yet:
      # the better-auth family declares an exact better-call, so a lone major
      # leaves two copies of the plugin types (#27, #34). Lift this with the
      # better-auth release that moves that peer.
      - dependency-name: better-call
        versions: [">=2"]
      # @types/node major = the oldest Node major this package supports
      # (CI and the dev toolchain run Node 24 LTS; the published package keeps its
      # engines.node ">=22" floor, and es2022 output). A newer types major describes
      # APIs a supported runtime does not have, and a library must not compile
      # against them. Move engines, CI node-version and @types/node together
      # when the support floor moves, then lift this ignore.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports typescript <6.1.0 only (8.72.0, 2026-10-22);
      # lift when it supports 7.x. TS 6.0.x stays allowed.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # semantic-release 25.0.9 bundles @semantic-release/release-notes-generator
      # 14.1.1, which renders with conventional-changelog-writer 8.x.
      # conventional-changelog-conventionalcommits 10.x refuses to render with a
      # writer older than 9 ("Your changelog tooling loaded an older writer"), so
      # release notes fail in the dry run. Lift when a stable release-notes-generator
      # (15.x, writer 9+) ships in a semantic-release release.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: ShipFast-Syndicate/.github*
      - dependency-name: Alphabros/.github*
