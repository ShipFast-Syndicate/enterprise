# Auth peers must move together. Group compatible updates and retain security alerts.
# Security scan policy: allow new versions to age; security updates are exempt.
# The better-auth and release-tooling groups (and the actions the release job
# runs) are still opened as PRs, but the merge gate never merges them without a
# maintainer: see MAINTAINER_* in .github/workflows/dependabot-merge-gate.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - better-auth
          - "@better-auth/*"
          - better-call
          - "@better-fetch/*"
          - semantic-release
          - "@semantic-release/*"
          - "conventional-changelog-*"
          - tsup
          - esbuild
          - typescript
      # Everything the release job executes; held for maintainer review.
      release-tooling:
        patterns:
          - semantic-release
          - "@semantic-release/*"
          - "conventional-changelog-*"
          - tsup
          - esbuild
          - typescript
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
          - better-call
          - "@better-fetch/*"
    labels:
      - dependencies
    ignore:
      # better-call 2 and later are not released as a better-auth peer yet:
      # the better-auth family declares an exact better-call, so a lone major
      # leaves two copies of the plugin types (#27, #34). Lift this with the
      # better-auth release that moves that peer.
      - dependency-name: better-call
        versions: [">=2"]
      # @types/node major = the oldest Node major this package supports
      # (engines.node ">=22", CI on Node 22). A newer types major describes
      # APIs a supported runtime does not have, and a library must not compile
      # against them. Move engines, CI node-version and @types/node together
      # when the support floor moves, then lift this ignore.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: ShipFast-Syndicate/.github*
      - dependency-name: Alphabros/.github*
